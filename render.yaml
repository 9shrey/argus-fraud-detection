# Render Blueprint — deploys the backend + a managed Postgres in one shot.
# Render dashboard -> New -> Blueprint -> pick this repo -> it reads this file.
# See README.md's Deployment section for the manual (non-Blueprint) steps.

databases:
  - name: argus-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: argus-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: argus-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*" # tighten to your deployed frontend's origin once you have it
      - key: RISK_THRESHOLD
        value: "65.0"
      - key: SIMULATION_RATE_TPS
        value: "2.0"
      - key: SIMULATION_FRAUD_RATE
        value: "0.06"
      - key: SIMULATION_NUM_USERS
        value: "150"
