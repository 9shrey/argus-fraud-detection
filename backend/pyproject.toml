[project]
name = "argus-backend"
version = "0.1.0"
description = "Real-time fraud detection engine — synthetic transaction stream, feature engineering, XGBoost + Isolation Forest ensemble, SHAP explainability."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2.3",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "xgboost>=2.1.1",
    "scikit-learn>=1.5.2",
    "shap>=0.46.0",
    "numba>=0.60.0",  # pins llvmlite to a build that supports py3.12 (shap's transitive pin is stale)
    "pandas>=2.2.3",
    "numpy>=2.1.0",
    "python-dotenv>=1.0.1",
    "websockets>=13.1",
    "faker>=30.3.0",
    "joblib>=1.4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI pattern is `param: T = Depends(...)` / `= Query(...)` by
# design — these calls are cheap and idempotent, not the mutable-default
# footgun B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
